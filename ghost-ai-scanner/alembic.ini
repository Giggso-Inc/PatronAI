# =============================================================
# FILE: alembic.ini
# PURPOSE: Alembic config for the PatronAI policy/identity DB
#          (ADR_2026-06-29). The DB URL is NOT stored here — env.py
#          reads it from the DATABASE_URL environment variable so no
#          credential ever lives in the repo (security_log 2026-06-29).
# USAGE:   cd ghost-ai-scanner && DATABASE_URL=... alembic upgrade head
# =============================================================

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally left blank — set via DATABASE_URL env (env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
