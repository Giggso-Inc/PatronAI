[project]
name = "extension-searcher"
version = "0.1.0"
description = "Cross-platform browser extension inventory tool"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
extension-searcher = "extension_searcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extension_searcher*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["extension_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in test that scans the real host (deselected by default)",
]
addopts = "-m \"not live\""
