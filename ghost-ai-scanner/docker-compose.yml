# =============================================================
# FILE: docker-compose.yml
# VERSION: 1.3.0
# UPDATED: 2026-07-21
# OWNER: Giggso Inc
# PURPOSE: Production docker-compose for single EC2 deployment.
#          Four containers: scanner, postgres, grafana, nginx.
#          Reads all config from .env generated by setup.sh.
# USAGE: bash scripts/start.sh   (preferred — handles env hygiene)
#    OR: docker compose up -d
# REQUIRES: .env file generated by scripts/setup.sh
# AUDIT LOG:
#   v1.0.0  2026-04-19  Initial.
#   v1.1.0  2026-04-29  Chat data backend env vars + Grafana password
#                       fail-loud + chat retention.
#   v1.2.0  2026-05-02  Stop interpolating AWS_ACCESS_KEY_ID /
#                       AWS_SECRET_ACCESS_KEY / AWS_REGION via ${VAR}
#                       in `environment:`. Compose was substituting
#                       from the SHELL environment of the user running
#                       `docker compose up`; if that shell had ever
#                       sourced an older .env (`set -a; source .env`),
#                       the exported value SHADOWED the freshly-edited
#                       on-disk .env, and the container started with
#                       stale credentials. Fix: rely solely on
#                       `env_file: .env` for AWS_* vars (always reads
#                       disk at container start, no shell shadowing).
#                       See scripts/start.sh for a safe wrapper.
#   v1.3.0  2026-07-21  Add postgres service (PR#8's policy/identity DB).
#                       DATABASE_URL points at the internal `postgres`
#                       service name (Docker network DNS), never a host
#                       IP — the container publishes no host port, so it's
#                       only reachable from other containers on
#                       `marauder-scan`. scanner now depends_on postgres
#                       (service_healthy) so migrations don't race startup.
# =============================================================

services:

  # ── Scanner + Streamlit ─────────────────────────────────────
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patronai
    restart: unless-stopped
    env_file: .env
    #depends_on:
    #  postgres:
    #    condition: service_healthy
    environment:
      # ── DO NOT interpolate AWS_* here ──────────────────────────────
      # `env_file: .env` injects AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # / AWS_REGION directly into the container at start, ALWAYS reading
      # fresh from disk. If we instead listed them as `${VAR}` here,
      # docker-compose would substitute from the SHELL environment of
      # the user running `docker compose up` — which can be stale (e.g.
      # left over from a previous `set -a; source .env`). That stale
      # value would shadow the on-disk value and silently use old creds.
      # See the bug write-up in the v1.2.0 audit log entry below.
      #
      # PATRONAI_BUCKET is preferred; MARAUDER_SCAN_BUCKET accepted as legacy alias.
      - MARAUDER_SCAN_BUCKET=${PATRONAI_BUCKET:-${MARAUDER_SCAN_BUCKET:-}}
      # Multi-cloud object store (Hub bootstrap also persists via PATRON_STORAGE_CONFIG_PATH)
      - STORAGE_MODE=${STORAGE_MODE:-s3}
      - OBJECT_BUCKET=${OBJECT_BUCKET:-}
      - LOCAL_STORAGE_ENDPOINT=${LOCAL_STORAGE_ENDPOINT:-}
      - LOCAL_STORAGE_ACCESS_KEY=${LOCAL_STORAGE_ACCESS_KEY:-}
      - LOCAL_STORAGE_SECRET_KEY=${LOCAL_STORAGE_SECRET_KEY:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_ACCOUNT=${AZURE_STORAGE_ACCOUNT:-}
      - AZURE_STORAGE_KEY=${AZURE_STORAGE_KEY:-}
      - AZURE_STORAGE_SAS_TOKEN=${AZURE_STORAGE_SAS_TOKEN:-}
      - GCP_SERVICE_ACCOUNT_JSON=${GCP_SERVICE_ACCOUNT_JSON:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - PATRON_STORAGE_CONFIG_PATH=${PATRON_STORAGE_CONFIG_PATH:-/data/patron_storage.json}
      # Policy/identity DB (PR#8) — `postgres` is the compose service name,
      # resolved via the `marauder-scan` bridge network's built-in DNS.
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-patronai}:${POSTGRES_PASSWORD}@raven-db:5432/${POSTGRES_DB:-patronai_policy}
      - COMPANY_NAME=${COMPANY_NAME}
      - COMPANY_SLUG=${COMPANY_SLUG}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # SUPPORT_EMAILS — comma-separated; sees Support view + Manager + Exec
      - SUPPORT_EMAILS=${SUPPORT_EMAILS:-}
      - ALERT_SNS_ARN=${ALERT_SNS_ARN}
      - TRINITY_WEBHOOK_URL=${TRINITY_WEBHOOK_URL}
      - LOGANALYZER_WEBHOOK_URL=${LOGANALYZER_WEBHOOK_URL}
      # SES alert email settings
      - ALERT_RECIPIENTS=${ALERT_RECIPIENTS:-}
      - PATRONAI_FROM_EMAIL=${PATRONAI_FROM_EMAIL:-noreply@patronai.ai}
      - SCAN_INTERVAL_SECS=${SCAN_INTERVAL_SECS:-300}
      - DEDUP_WINDOW_MINUTES=${DEDUP_WINDOW_MINUTES:-60}
      - CROWDSTRIKE_ENABLED=${CROWDSTRIKE_ENABLED:-false}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-aws}
      - STREAMLIT_PORT=8501
      - STREAMLIT_SERVER_BASE_URL_PATH=patronai
      # PUBLIC_HOST = EC2 public IP or DNS, e.g. 3.91.73.197
      # GRAFANA_URL = full Grafana base URL, e.g. http://3.91.73.197/grafana
      # If GRAFANA_URL is set it takes precedence over PUBLIC_HOST
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - GRAFANA_URL=${GRAFANA_URL:-}
      # LLM chat — llama-server runs inside the container on :8080
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compat}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8080}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_REPO=${LLM_MODEL_REPO:-LiquidAI/LFM2.5-1.2B-Thinking-GGUF}
      # ── Chat data backend (S3 hourly rollups) ────────────────
      # Hourly rollup job aggregates findings/.../jsonl into per-user
      # and per-tenant dimension files for the chat tools to query.
      - ROLLUP_HOURLY_OFFSET_MINUTES=${ROLLUP_HOURLY_OFFSET_MINUTES:-5}
      # First-deploy backfill: when no rollups exist yet, process the last
      # N days so chat has historical data to answer over from the start.
      - ROLLUP_INITIAL_BACKFILL_DAYS=${ROLLUP_INITIAL_BACKFILL_DAYS:-7}
      # LLM read timeout (seconds) — even with the perf cap below,
      # multi-turn tool-call loops on CPU can still take 30-60s.
      # Anthropic / OpenAI cloud endpoints are much faster — drop to
      # 60 if you swap LLM_PROVIDER over.
      - LLM_READ_TIMEOUT_S=${LLM_READ_TIMEOUT_S:-180}
      # Lowered 1024 → 384 on 2026-05-02 after CPU inference at 10 tok/s
      # was burning 110 sec/turn on runaway thinking output. The system
      # prompt caps user-facing answers at ≤100 words (~150 tokens);
      # 384 leaves comfortable room for the **Sources:** footer + a
      # few extra bullets without ever truncating real content.
      # Increase if a larger model (Qwen2.5-7B+) needs more headroom.
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-384}
      # llama-server slot count. CRITICAL — llama-server divides
      # --ctx-size EVENLY across slots. Single-tenant chat needs 1 slot
      # so each slot gets the full ctx-size budget. Bump only if you
      # multi-tenant the chat panel (you'll also want to bump ctx-size).
      - LLM_PARALLEL_SLOTS=${LLM_PARALLEL_SLOTS:-1}
      # Per-slot context window. 16384 leaves comfortable headroom for
      # system prompt + tool schemas + chat history + Thinking-model
      # reasoning + answer + Sources footer. RAM cost ~250 MB per 8K
      # token doubling on Q4_K_M.
      - LLM_CTX_SIZE=${LLM_CTX_SIZE:-16384}
      # Chat conversation S3 retention (auto-expires keys under chat/).
      - CHAT_HISTORY_RETENTION_DAYS=${CHAT_HISTORY_RETENTION_DAYS:-30}
      # Docs RAG auto-refresh: how often to check for changed doc files.
      # 0 / very low values clamp to 60s; default 5 min is plenty since
      # docs change at most once per deploy.
      - DOCS_REFRESH_INTERVAL_S=${DOCS_REFRESH_INTERVAL_S:-300}
      - INTEGRATION_API_ENABLED=${INTEGRATION_API_ENABLED:-1}
      - API_KEY=${API_KEY:-mOBakBb4ECT1exikCkkc6QDb}
      - INTEGRATION_API_PORT=${INTEGRATION_API_PORT:-8002}
      - RAVEN_HUB_URL=https://gsd.giggso.com
      - RAVEN_AGENT_KEY=6f08da50538e54f6382dc5b073cb044a223a063b
      - COMPANY_SLUG=giggso
      - STORAGE_MODE=${STORAGE_MODE}
      - PATRONAI_BUCKET=${PATRONAI_BUCKET}
      - OBJECT_BUCKET=${OBJECT_BUCKET}
      - PATRON_STORAGE_CONFIG_PATH=${PATRON_STORAGE_CONFIG_PATH}
      - LOCAL_STORAGE_ENDPOINT=${LOCAL_STORAGE_ENDPOINT}
      - LOCAL_STORAGE_ACCESS_KEY=${LOCAL_STORAGE_ACCESS_KEY}
      - LOCAL_STORAGE_SECRET_KEY=${LOCAL_STORAGE_SECRET_KEY}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_ACCOUNT=${AZURE_STORAGE_ACCOUNT}
      - AZURE_STORAGE_KEY=${AZURE_STORAGE_KEY}
      - AZURE_STORAGE_SAS_TOKEN=${AZURE_STORAGE_SAS_TOKEN}
      - GCP_SERVICE_ACCOUNT_JSON=${GCP_SERVICE_ACCOUNT_JSON}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}

    volumes:
      - patronai-models:/models
      - patronai-data:/data
    ports:
      - "8502:8501"
      - "8003:8002"
    networks:
      - marauder-scan
      - db-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/patronai/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Grafana ─────────────────────────────────────────────────
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: marauder-scan-grafana
    restart: unless-stopped
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Fail-loud if missing: this expansion exits the compose stack startup
      # with an explicit error rather than booting Grafana with a known
      # default password. Set GF_SECURITY_ADMIN_PASSWORD in .env (generated
      # by scripts/setup.sh).
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_USERS_DEFAULT_THEME=light
      #- GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_ROOT_URL=https://patronai.giggso.com/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3010:3000"
    networks:
      - marauder-scan
      - db-net
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


networks:
  marauder-scan:
    driver: bridge
  db-net:
    external: true

volumes:
  grafana-data:
    driver: local
  patronai-models:
    driver: local
  patronai-data:
    driver: local
  #postgres-data:
  #  driver: local
