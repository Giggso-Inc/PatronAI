apiVersion: 1

datasources:
  # Server-side (access: proxy) fetch over the docker network, so MinIO is
  # never reached from the browser and needs no public exposure.
  - name: GhostAI-S3-Summary
    uid: patronai-summary
    type: marcusolsson-json-datasource
    access: proxy
    url: http://minio:9000/patronai-scan-bucket
    isDefault: true
    jsonData:
      queryParams: ""
    editable: false

  - name: GhostAI-S3-Findings
    uid: patronai-findings
    type: marcusolsson-json-datasource
    access: proxy
    url: http://minio:9000/patronai-scan-bucket
    isDefault: false
    jsonData:
      queryParams: ""
    editable: false
